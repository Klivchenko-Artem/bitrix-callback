services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      BITRIX_DIST_URL: ${BITRIX_DIST_URL:-https://www.1c-bitrix.ru/download/start_encode.tar.gz}
      # Только для подсказки в логе: наружу порт публикует nginx
      HTTP_PORT: ${HTTP_PORT:-8081}
    volumes:
      - www:/var/www/html
      # В репозитории лежит только сам модуль; всё, что он ставит
      # (компонент, демо-страница), остаётся внутри тома с ядром
      - ./local/modules/artem.callback:/var/www/html/local/modules/artem.callback
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Порт подвижный: 8080 на машине занимает магазин
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - www:/var/www/html
      - ./local/modules/artem.callback:/var/www/html/local/modules/artem.callback
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    command: >
      --sql-mode=""
      --transaction-isolation=READ-COMMITTED
      --innodb-flush-log-at-trx-commit=2
      --max-allowed-packet=64M
    environment:
      # Пароли стендовые: база поднимается пустой на локальной машине
      # и наружу не смотрит. В бою Битрикс ставят не так
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bitrix
      MYSQL_USER: bitrix
      MYSQL_PASSWORD: bitrix
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Почта никуда не уходит, всё письма видно в браузере
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8027}:8025"

volumes:
  www:
  mysql:
