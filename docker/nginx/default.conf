server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 128m;

    # Битрикс сам решает, что делать с несуществующим путём
    location / {
        try_files $uri $uri/ @bitrix;
    }

    location @bitrix {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/bitrix/urlrewrite.php;
        fastcgi_param SCRIPT_NAME /bitrix/urlrewrite.php;
    }

    location ~ \.php$ {
        try_files $uri @bitrix;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 300;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Служебные каталоги наружу не отдаём
    location ~* ^/(upload|bitrix/managed_cache|bitrix/stack_cache|bitrix/php_interface)/.*\.(php|php3|php4|php5|phtml)$ {
        deny all;
    }

    location ~* /\.(ht|git) {
        deny all;
    }
}
